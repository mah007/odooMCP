[project]
name = "odoo-mcp-server"
version = "2.0.0"
description = "Odoo MCP Server with Admin Controller UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mahmoud Abdel Latif", email = "imod007@gmail.com"}]
license = {text = "MIT"}
keywords = ["mcp", "odoo", "erp", "ai", "integration"]

dependencies = [
    "mcp==1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

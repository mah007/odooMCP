services:
  mcp-server:
    build: .
    ports:
      - "${MCP_PORT:-8000}:8000"
      - "${CONTROLLER_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - MCP_PORT=8000
      - CONTROLLER_PORT=8001
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
